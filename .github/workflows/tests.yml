name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Linux job — Ubuntu with offscreen Qt platform
  # ───────────────────────────────────────────────────────────────────────────
  linux:
    name: Linux (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libdbus-1-3 \
            libgl1 \
            libfontconfig1 \
            libnss3 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-dev.txt

      - name: Run unittest suite (with coverage)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          coverage run --data-file=.coverage.unittest --source=core,utils,ui,cli --branch -m unittest test_rnv_text_transformer

      - name: Run pytest suite (with coverage)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          coverage run --data-file=.coverage.pytest --source=core,utils,ui,cli --branch -m pytest tests/ --benchmark-disable

      - name: Combine coverage data
        run: |
          coverage combine .coverage.unittest .coverage.pytest

      - name: Print coverage report
        run: |
          coverage report

      # RNV-COVERAGE-STAYS-IN-CI, 2026-10-05. The job ends with the report above.
      # It used to hand a copy to an outside coverage service as well. On
      # 2026-10-05 that service refused connections, and the step that
      # called it failed a job whose tests had all passed. It was ruled out
      # the same day as not needed. tests/test_coverage_stays_in_ci.py keeps
      # it out.

  # ───────────────────────────────────────────────────────────────────────────
  # Windows job — native Qt, no display server needed
  # ───────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows (Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-dev.txt

      - name: Run unittest suite (with coverage)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          coverage run --data-file=.coverage.unittest --source=core,utils,ui,cli --branch -m unittest test_rnv_text_transformer

      - name: Run pytest suite (with coverage)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          coverage run --data-file=.coverage.pytest --source=core,utils,ui,cli --branch -m pytest tests/ --benchmark-disable

      - name: Combine coverage data
        run: |
          coverage combine .coverage.unittest .coverage.pytest

      - name: Print coverage report
        run: |
          coverage report

      # RNV-COVERAGE-STAYS-IN-CI: as in the Linux job. The job ends with the
      # report above.
